name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/angel-launcher-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: angel-launcher-debug-apk
          path: out/angel-launcher-debug.apk
          if-no-files-found: error

      # One rolling release per published branch, re-uploaded in place, so the
      # download link never changes:
      # /releases/download/<tag>/angel-launcher-debug.apk
      # Trunk keeps `debug`; a branch published for testing gets its own tag, so
      # a feature build never replaces trunk's.
      - name: Publish the APK
        if: >-
          github.ref_name == 'claude/angel-launcher-build-9hynbh' ||
          github.ref_name == 'claude/home-assistant-widget-config-54zs9j'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: >-
            ${{ github.ref_name == 'claude/angel-launcher-build-9hynbh'
                && 'debug' || 'debug-home-widgets' }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Debug build — $TAG" --notes "bootstrapping"
          gh release upload "$TAG" out/angel-launcher-debug.apk --clobber
          gh release edit "$TAG" --notes \
            "Build ${{ github.run_number }} — ${GITHUB_SHA:0:7} on \`${{ github.ref_name }}\`."

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
