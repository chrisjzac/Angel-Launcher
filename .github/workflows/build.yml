name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate the Google Fonts certificate array
        if: always()
        run: |
          echo "Artifacts defining com_google_android_gms_fonts_certs:"
          grep -rl 'com_google_android_gms_fonts_certs' ~/.gradle/caches \
            --include='*.xml' 2>/dev/null | head -20 || echo "  none found"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/angel-launcher-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: angel-launcher-debug-apk
          path: out/angel-launcher-debug.apk
          if-no-files-found: error

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
