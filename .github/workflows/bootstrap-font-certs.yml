name: bootstrap-font-certs

# One-shot. The Google Fonts provider is verified against a certificate array
# that no dependency ships — the app has to vendor it. This job sources that
# array, writes res/values/font_certs.xml, and commits it. Delete this
# workflow once the file is in the tree.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/bootstrap-font-certs.yml']

permissions:
  contents: write

jobs:
  certs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source the certificate array
        run: |
          set -u
          out=app/src/main/res/values/font_certs.xml
          mkdir -p "$(dirname "$out")"
          found=""

          # Google Maven first: an artifact that ships the array is the most
          # authoritative source available to a runner.
          for coord in \
            com.google.android.gms:play-services-basement:18.4.0 \
            com.google.android.gms:play-services-base:18.5.0 \
            androidx.core:core:1.13.1 \
            androidx.compose.ui:ui-text-google-fonts:1.7.5
          do
            g=$(echo "$coord" | cut -d: -f1 | tr . /)
            a=$(echo "$coord" | cut -d: -f2)
            v=$(echo "$coord" | cut -d: -f3)
            echo "checking $coord"
            if curl -fsSL -o /tmp/probe.aar \
                 "https://dl.google.com/dl/android/maven2/$g/$a/$v/$a-$v.aar"; then
              unzip -p /tmp/probe.aar 'res/values/*.xml' > /tmp/values.xml 2>/dev/null || true
              if grep -q com_google_android_gms_fonts_certs /tmp/values.xml; then
                echo "  array found"
                {
                  echo '<?xml version="1.0" encoding="utf-8"?>'
                  echo '<resources>'
                  sed -n '/name="com_google_android_gms_fonts_certs/,/<\/[a-z-]*array>/p' /tmp/values.xml
                  echo '</resources>'
                } > "$out"
                found="$coord"
                break
              fi
              echo "  present, no array"
            else
              echo "  not fetchable"
            fi
          done

          # Otherwise Google's own Downloadable Fonts sample, which carries the
          # canonical font_certs.xml verbatim.
          if [ -z "$found" ]; then
            for url in \
              https://raw.githubusercontent.com/android/user-interface-samples/main/DownloadableFonts/app/src/main/res/values/font_certs.xml \
              https://raw.githubusercontent.com/android/user-interface-samples/master/DownloadableFonts/app/src/main/res/values/font_certs.xml \
              https://raw.githubusercontent.com/googlesamples/android-DownloadableFonts/master/Application/src/main/res/values/font_certs.xml
            do
              echo "checking $url"
              if curl -fsSL -o /tmp/font_certs.xml "$url" \
                 && grep -q com_google_android_gms_fonts_certs /tmp/font_certs.xml; then
                echo "  fetched"
                cp /tmp/font_certs.xml "$out"
                found="$url"
                break
              fi
            done
          fi

          if [ -z "$found" ]; then
            echo "::error::Could not source the certificate array anywhere."
            exit 1
          fi

          echo "--- sourced from $found"
          echo "--- $(grep -c '<item' "$out") certificate items"
          head -5 "$out"

      - name: Commit the file
        run: |
          out=app/src/main/res/values/font_certs.xml
          if [ -z "$(git status --porcelain "$out")" ]; then
            echo "no change"; exit 0
          fi
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add "$out"
          git commit -m "Fonts: vendor the Google Fonts provider certificates [skip ci]"
          git push
