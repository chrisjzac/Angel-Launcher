name: bootstrap-font-certs

# One-shot. The Google Fonts provider is verified against a certificate array
# that no dependency ships — the app has to vendor it. This job sources that
# array from Google's own artifacts, writes res/values/font_certs.xml, and
# commits it. Delete this workflow once the file is in the tree.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source the certificate array
        run: |
          set -u
          out=app/src/main/res/values/font_certs.xml
          found=""

          # Google Maven. The array lives in whichever GMS artifact still
          # carries the font provider resources; check each rather than guess.
          for coord in \
            com.google.android.gms:play-services-basement:18.4.0 \
            com.google.android.gms:play-services-base:18.5.0 \
            androidx.core:core:1.13.1 \
            androidx.compose.ui:ui-text-google-fonts:1.7.5
          do
            g=$(echo "$coord" | cut -d: -f1 | tr . /)
            a=$(echo "$coord" | cut -d: -f2)
            v=$(echo "$coord" | cut -d: -f3)
            url="https://dl.google.com/dl/android/maven2/$g/$a/$v/$a-$v.aar"
            echo "checking $coord"
            if curl -fsSL -o /tmp/probe.aar "$url" 2>/dev/null; then
              if unzip -p /tmp/probe.aar 'res/values/*.xml' 2>/dev/null \
                   | grep -q com_google_android_gms_fonts_certs; then
                echo "  array found in $coord"
                unzip -p /tmp/probe.aar 'res/values/*.xml' > /tmp/values.xml
                found="$coord"
                break
              fi
              echo "  present, no array"
            else
              echo "  not fetchable"
            fi
          done

          if [ -z "$found" ]; then
            echo "No Google Maven artifact carries the array; falling back to"
            echo "Google's own Downloadable Fonts sample."
            for url in \
              https://raw.githubusercontent.com/android/user-interface-samples/main/DownloadableFonts/app/src/main/res/values/font_certs.xml \
              https://raw.githubusercontent.com/android/testing-samples/main/ui/espresso/DownloadableFonts/app/src/main/res/values/font_certs.xml
            do
              echo "checking $url"
              if curl -fsSL -o /tmp/font_certs.xml "$url" 2>/dev/null \
                 && grep -q com_google_android_gms_fonts_certs /tmp/font_certs.xml; then
                echo "  fetched"
                mkdir -p "$(dirname "$out")"
                cp /tmp/font_certs.xml "$out"
                found="$url"
                break
              fi
            done
          else
            # Lift just the two cert arrays out of the merged values.xml.
            mkdir -p "$(dirname "$out")"
            {
              echo '<?xml version="1.0" encoding="utf-8"?>'
              echo '<resources>'
              python3 - "$found" <<'PY'
import re, sys
src = open('/tmp/values.xml').read()
for name in ('com_google_android_gms_fonts_certs',
             'com_google_android_gms_fonts_certs_dev',
             'com_google_android_gms_fonts_certs_prod'):
    m = re.search(r'<(string-)?array name="%s".*?</(string-)?array>' % name, src, re.S)
    if m:
        print('    ' + m.group(0).strip())
PY
              echo '</resources>'
            } > "$out"
          fi

          if [ -z "$found" ]; then
            echo "::error::Could not source the certificate array from any known place."
            exit 1
          fi

          echo "--- $out"
          cat "$out"
          grep -c '<item' "$out"

      - name: Commit the file
        run: |
          out=app/src/main/res/values/font_certs.xml
          if git diff --quiet -- "$out" && [ -z "$(git status --porcelain "$out")" ]; then
            echo "no change"; exit 0
          fi
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add "$out"
          git commit -m "Fonts: vendor the Google Fonts provider certificates [skip ci]

The provider is verified against an array no dependency ships, so the app
has to carry it. Sourced from Google and committed by the one-shot
bootstrap-font-certs workflow, which can now be deleted."
          git push
